---
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.26"
    - env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        args: release --clean
        version: ~> v2
    - id: version
      name: Derive version
      run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
    - name: Install nfpm
      run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
    - env:
        VERSION: ${{ steps.version.outputs.version }}
      name: Build APK package - x86_64
      run: nfpm package -f nfpm/x86_64.yaml -p apk -t dist/
    - env:
        VERSION: ${{ steps.version.outputs.version }}
      name: Build APK package - aarch64_cortex-a53
      run: nfpm package -f nfpm/a53.yaml -p apk -t dist/
    - env:
        VERSION: ${{ steps.version.outputs.version }}
      name: Build APK package - aarch64_cortex-a72
      run: nfpm package -f nfpm/a72.yaml -p apk -t dist/
    - env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      name: Upload APK packages to release
      run: gh release upload ${{ github.ref_name }} dist/*.apk --clobber
name: Build and Publish Release
on:
  push:
    tags:
    - v*
permissions:
  contents: write
